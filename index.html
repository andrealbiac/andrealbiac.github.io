<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Andrea Albiac - Graphic Designer</title>
        <link rel="icon" type="image/png" href="img/sun.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    
    <body>
        <div id="background-container">
            <div id="scrollable-container"></div>
        </div>
        <button id="auto-scroll-btn" class="auto-scroll-btn">
            <img src="img/sun.png" alt="Auto Scroll" class="sun-icon">
        </button>
        <div class="scroll-cue">Scroll down!</div>
        <div class="index-text">
            <p>Hey! I'm Andrea Albiac, a graphic designer based in Amsterdam. I do <a href="#" class="branding-trigger">branding</a> and <a href="#" class="websites-trigger">websites</a> for clients and friends, 2D <a href="#" class="motion-trigger">motion graphics</a>, sometimes <a href="#" class="mixedmedia-trigger">mixed media animation</a>. I also make <a href="#" class="pottery-trigger">pottery chairs</a> in my free time -check out my <a href="https://instagram.com/andrea.albiac" target="_blank">Instagram</a> to see more.</p>
        </div>

        <!-- Branding slideshow -->
        <div class="branding-hover-container">
            <div class="slideshow">
                <img src="img/brand-1.png" alt="Branding 1" class="slide">
                <img src="img/brand-2.png" alt="Branding 2" class="slide">
                <img src="img/brand-3.png" alt="Branding 3" class="slide">
                <img src="img/brand-4.gif" alt="Branding 4" class="slide">
            </div>
        </div>

        <!-- Websites slideshow -->
        <div class="websites-hover-container">
            <div class="slideshow">
                <img src="img/web-1.png" alt="Website 1" class="slide">
                <img src="img/web-2.png" alt="Website 2" class="slide">
                <img src="img/web-3.png" alt="Website 3" class="slide">
                <img src="img/web-4.png" alt="Website 4" class="slide">
                <img src="img/web-5.png" alt="Website 5" class="slide">
                <img src="img/web-6.png" alt="Website 6" class="slide">
                <img src="img/web-7.png" alt="Website 7" class="slide">
                <img src="img/web-8.png" alt="Website 8" class="slide">
                <img src="img/web-9.png" alt="Website 9" class="slide">
            </div>
        </div>

        <!-- Motion graphics slideshow -->
        <div class="motion-container">
            <div class="slideshow">
                <img src="img/motion-1.gif" alt="Motion 1" class="slide">
                <img src="img/motion-2.gif" alt="Motion 2" class="slide">
            </div>
        </div>

        <!-- Mixed media animation single image -->
        <div class="mixedmedia-container">
            <img src="img/sun-1.gif" alt="Mixed Media Animation Preview" class="single-image">
        </div>

        <!-- Pottery chairs slideshow -->
        <div class="pottery-hover-container">
            <div class="slideshow">
                <img src="img/chair-1.jpeg" alt="Chair 1" class="slide">
                <img src="img/chair-2.jpeg" alt="Chair 2" class="slide">
                <img src="img/chair-3.jpeg" alt="Chair 3" class="slide">
                <img src="img/chair-4.jpeg" alt="Chair 4" class="slide">
                <img src="img/chair-5.jpeg" alt="Chair 5" class="slide">
                <img src="img/chair-6.jpeg" alt="Chair 6" class="slide">
            </div>
        </div>
    </body>
    <script src="main.js"></script>
    <script src="background.js"></script>
</html>
